services:
  # ---------- バックエンド Web Service ----------
  - type: web
    name: nba-news-backend
    env: python
    plan: free
    buildCommand: pip install -r app/backend/requirements.txt
    startCommand: cd app/backend && python main.py
    healthCheckPath: /healthz
    envVars:
      # シークレット（Renderダッシュボードで手動入力。このファイルには値を書かない）
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: BALLDONTLIE_API_KEY
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: USERNAME
        sync: false
      - key: USER_PASSWORD
        sync: false
      # 通常値
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        sync: false
      - key: ENABLE_SCHEDULER
        value: "false"
      - key: ALLOWED_ORIGINS
        value: https://nba-news-frontend.onrender.com
      - key: PYTHON_VERSION
        value: 3.11.18

  # ---------- フロントエンド Static Site ----------
  - type: web
    env: static
    name: nba-news-frontend
    buildCommand: cd app/frontend && npm install && npm run build
    staticPublishPath: app/frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://nba-news-backend-ppsd.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
