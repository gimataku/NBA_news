name: NBA News Batch

on:
  schedule:
    - cron: "23 21,1,5,9,13,17 * * *"
  workflow_dispatch:                      # 手動実行（/api/fetch の代替）

jobs:
  run-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.18'
          cache: pip
          cache-dependency-path: app/backend/requirements.txt

      # SEC-1：pip < 26.2.2 は vendored certifi をシステムストアに加えて常に信頼し、
      # 無効化する手段がない（python.org の告知）。依存の取得経路を先に塞ぐ。
      - name: Upgrade pip
        run: python -m pip install --upgrade "pip>=26.2.2"

      - run: pip install -r app/backend/requirements.txt

      # SEC-1：依存を入れた後に版を残す（恒久）。Python 3.11.18+／pip 26.2.2+／certifi 2026.10.19+ であること。
      - name: Show versions
        run: |
          python -VV
          python -m pip --version
          python -c "import certifi; print('certifi', certifi.__version__)"

      - name: Run batch
        working-directory: app/backend
        env:
          ANTHROPIC_API_KEY:    ${{ secrets.ANTHROPIC_API_KEY }}
          BALLDONTLIE_API_KEY:  ${{ secrets.BALLDONTLIE_API_KEY }}
          DATABASE_URL:         ${{ secrets.DATABASE_URL }}
          HEALTHCHECK_PING_URL: ${{ secrets.HEALTHCHECK_PING_URL }}
        run: python run_batch_once.py